[project]
name = "voza"
version = "1.0.0"
description = "AI-powered voice-to-text for macOS and Linux"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pynput>=1.7.6; sys_platform == 'darwin'",
    "evdev>=1.7.0; sys_platform == 'linux'",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[tool.uv]
package = false
